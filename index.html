<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz do Centenário de Criciúma — Encerrado</title>

  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --bg:#ffffff;
      --text:#111111;
      --muted:#555555;
      --border:#e9e9e9;
      --gold:#c9a227;
      --gold-2:#b88900;
      --shadow:0 10px 30px rgba(0,0,0,.08);
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    .wrap{
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    header{
      border-bottom:1px solid var(--border);
      background:#fff;
    }

    .head{
      width:min(980px,94vw);
      margin:0 auto;
      padding:16px 0;
      display:flex;
      justify-content:center;
    }

    .head img{
      max-width:420px;
      width:100%;
      height:auto;
    }

    main{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:18px;
      padding:32px 28px;
      max-width:560px;
      width:100%;
      text-align:center;
      box-shadow:var(--shadow);
    }

    h1{
      margin:0 0 12px;
      font-size:clamp(22px,4vw,30px);
      font-weight:900;
    }

    p{
      margin:0 0 14px;
      color:var(--muted);
      font-size:16px;
      line-height:1.5;
    }

    .btn{
      margin-top:18px;
      display:inline-block;
      padding:14px 22px;
      border-radius:14px;
      font-size:17px;
      font-weight:900;
      text-decoration:none;
      color:#111;
      background:linear-gradient(180deg,var(--gold),var(--gold-2));
      box-shadow:0 6px 18px rgba(201,162,39,.35);
      transition:transform .08s ease, filter .2s ease;
    }

    .btn:hover{
      filter:brightness(1.05);
      transform:translateY(-1px);
    }

    footer{
      border-top:1px solid var(--border);
      background:#fff;
    }

    .footer-inner{
      width:min(980px,94vw);
      margin:0 auto;
      padding:12px;
      display:flex;
      justify-content:center;
    }

    .footer-inner img{
      max-width:100%;
      height:auto;
    }
  </style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="head">
      <img src="assets/hn-logo.png" alt="HN Notícias">
    </div>
  </header>

  <main>
    <div class="card">
      <h1>Quiz do Centenário de Criciúma</h1>

      <p>
        A campanha comemorativa do <strong>Quiz do Centenário de Criciúma</strong> foi oficialmente encerrada.
      </p>

      <p>
        Agradecemos a todos que participaram e celebraram conosco os
        <strong>100 anos de emancipação político-administrativa</strong> do município.
      </p>

      <a class="btn" href="https://hnnoticias.com.br" target="_blank" rel="noopener">
        Ir para o HN Notícias
      </a>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <img src="assets/banner-projeto-centenario.png.jpg"
           alt="Projeto Criciúma 100 Anos — banner oficial">
    </div>
  </footer>

</div>
</body>
</html>
