<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consultar código do Quiz — HN Notícias</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#ffffff; --text:#111; --muted:#555;
      --card:#fff; --border:#e9e9e9;
      --gold:#c9a227; --gold-2:#b88900;
      --btn:#111; --btn-text:#fff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{min-height:100dvh;display:flex;flex-direction:column}
    header{border-bottom:1px solid var(--border);background:#fff}
    .head{width:min(980px,94vw);margin:0 auto;padding:12px 0 8px}
    .logo-wrap{display:flex;justify-content:center}
    .logo-wrap img{display:block;width:100%;max-width:320px;height:auto}
    .head h1{margin:8px 0 0;text-align:center;font-size:clamp(18px,3.6vw,22px)}

    main{width:min(520px,94vw);margin:20px auto;flex:1}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}

    label span{display:block;font-size:14px;margin-bottom:4px;font-weight:600}
    input[type="tel"]{
      width:100%;padding:10px 12px;border-radius:10px;
      border:1px solid #d4d4d4;font-size:16px;
    }
    .hint{margin-top:6px;font-size:13px;color:var(--muted)}

    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .btn{
      appearance:none;border-radius:12px;padding:10px 14px;
      border:1px solid var(--btn);background:var(--btn);color:var(--btn-text);
      font-weight:700;cursor:pointer;font-size:15px;
    }
    .btn.secondary{background:#fff;color:#111;border:1px solid #cfcfcf}
    .btn[disabled]{opacity:.6;cursor:not-allowed}

    .result{margin-top:16px;border-radius:14px;padding:12px 14px;border:1px solid #e3e3e3;background:#fafafa}
    .result h2{margin:0 0 6px;font-size:17px}
    .code{
      display:inline-block;margin-top:4px;
      font-size:20px;font-weight:900;letter-spacing:2px;
      background:#fff;border:1px solid #ddd;border-radius:10px;
      padding:6px 10px;
    }
    .status{margin-top:6px;font-size:14px}
    .status span{font-weight:700}
    .small{font-size:13px;color:var(--muted);margin-top:4px}
    .error{margin-top:12px;font-size:14px;color:#b00020}
    .ok{color:#1b5e20}

    footer{border-top:1px solid var(--border);background:#fff}
    .footer-inner{width:min(980px,94vw);margin:0 auto;padding:12px;display:flex;justify-content:center}
    .footer-inner img{max-width:100%;height:auto}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head">
      <div class="logo-wrap"><img src="assets/hn-logo.png" alt="HN Notícias"></div>
      <h1>Consultar seu código do Quiz</h1>
    </div>
  </header>

  <main>
    <div class="card">
      <label>
        <span>Informe o WhatsApp usado no cadastro</span>
        <input id="whats" type="tel" placeholder="(48) 9XXXX-XXXX" inputmode="tel" />
      </label>
      <div class="hint">
        Digite o número com DDD. Usaremos apenas os dígitos para localizar o seu código.
      </div>

      <div class="actions">
        <button id="btnSearch" class="btn" type="button">Consultar código</button>
        <button id="btnLogin" class="btn secondary" type="button" onclick="window.location.href='login.html'">
          Iniciar o Quiz
        </button>
      </div>

      <div id="msgError" class="error" style="display:none"></div>
      <div id="result" class="result" style="display:none"></div>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <img src="assets/banner-projeto-centenario.png.jpg" alt="Projeto Criciúma 100 Anos — banner oficial" />
    </div>
  </footer>
</div>

<script>
  const SUPABASE_URL  = "https://fpstwfzqvactvlgwgagu.supabase.co";
  const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZwc3R3ZnpxdmFjdHZsZ3dnYWd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA2NjE2NTgsImV4cCI6MjA3NjIzNzY1OH0._hoxv_VMLcK6ZAVjmR2mV1t8Ma5vr9h-Ti_sIL42CPI";

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  const elWhats   = document.getElementById('whats');
  const elBtn     = document.getElementById('btnSearch');
  const elResult  = document.getElementById('result');
  const elError   = document.getElementById('msgError');

  function normalizeDigits(str){
    return (str || '').replace(/\D/g, '');
  }

  function formatDateBR(iso){
    if(!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('pt-BR');
  }

  function mapStatus(status){
    switch((status || '').toLowerCase()){
      case 'pendente': return 'A retirar';
      case 'retirado': return 'Retirado';
      case 'expirado': return 'Expirado';
      default: return status || '—';
    }
  }

  async function searchVoucher(){
    elError.style.display = 'none';
    elResult.style.display = 'none';

    const raw = elWhats.value.trim();
    if (!raw){
      elError.textContent = 'Informe o número de WhatsApp utilizado no cadastro.';
      elError.style.display = 'block';
      return;
    }

    const digits = normalizeDigits(raw);
    if (digits.length < 10){
      elError.textContent = 'Digite o número completo com DDD.';
      elError.style.display = 'block';
      return;
    }

    elBtn.disabled = true;
    elBtn.textContent = 'Consultando...';

    try{
      // Tentamos localizar pelo trecho de dígitos (para tolerar parênteses, traços etc.)
      const { data, error } = await client
        .from('ganhadores_busca_v')
        .select('code,status,expires_at,nome,cidade,whatsapp')
        .ilike('whatsapp', '%' + digits + '%')
        .order('issued_at', { ascending:false })
        .limit(1);

      if (error) {
        console.error(error);
        elError.textContent = 'Não foi possível consultar agora. Tente novamente em instantes.';
        elError.style.display = 'block';
        return;
      }

      if (!data || !data.length){
        elError.innerHTML =
          'Nenhum voucher encontrado para este WhatsApp.<br>' +
          'Confira se o número está correto ou, se preferir, clique em "Iniciar o Quiz" para participar novamente.';
        elError.style.display = 'block';
        return;
      }

      const v = data[0];
      const statusLabel = mapStatus(v.status);
      const expires = formatDateBR(v.expires_at);

      elResult.innerHTML = `
        <h2>Código localizado</h2>
        <div><strong>Nome:</strong> ${v.nome || '—'}</div>
        <div><strong>Cidade:</strong> ${v.cidade || '—'}</div>
        <div style="margin-top:8px"><strong>Seu código:</strong> <span class="code">${v.code}</span></div>
        <div class="status">
          <span>Status:</span> ${statusLabel}
        </div>
        <div class="small">
          Validade: ${expires || 'verifique com a equipe do HN Notícias'}.
          Apresente um documento com foto no momento da retirada.
        </div>
      `;
      elResult.style.display = 'block';
    } catch(e){
      console.error(e);
      elError.textContent = 'Ocorreu um erro ao consultar. Tente novamente em instantes.';
      elError.style.display = 'block';
    } finally{
      elBtn.disabled = false;
      elBtn.textContent = 'Consultar código';
    }
  }

  elBtn.addEventListener('click', searchVoucher);
  elWhats.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){ e.preventDefault(); searchVoucher(); }
  });
</script>
</body>
</html>
