<script>
  // === CONFIG ===
  const SUPABASE_URL = "https://fpstwfzqvactvlgwgagu.supabase.co";
  const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZwc3R3ZnpxdmFjdHZsZ3dnYWd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA2NjE2NTgsImV4cCI6MjA3NjIzNzY1OH0._hoxv_VMLcK6ZAVjmR2mV1t8Ma5vr9h-Ti_sIL42CPI";
  const PDF_URL = "";
  const BATCH_SIZE = 10;

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  // === Estado ===
  const els = {
    progressWrap: document.getElementById('progressWrap'),
    progressText: document.getElementById('progressText'),
    progressBar: document.getElementById('progressBar'),
    question: document.getElementById('question'),
    options: document.getElementById('options'),
    feedback: document.getElementById('feedback'),
    btnTryAgain: document.getElementById('btnTryAgain'),
    btnNext: document.getElementById('btnNext'),
    btnSkip: document.getElementById('btnSkip'),
    quizView: document.getElementById('quizView'),
    finalView: document.getElementById('finalView'),
    selectorView: document.getElementById('selectorView'),
    voucherBox: document.getElementById('voucherBox'),
    voucherCode: document.getElementById('voucherCode'),
    voucherValidity: document.getElementById('voucherValidity'),
    btnDownload: document.getElementById('btnDownload'),
    btnCopy: document.getElementById('btnCopy'),
    btnContinue: document.getElementById('btnContinue'),
    continueRow: document.getElementById('continueRow'),
    finalTitle: document.getElementById('finalTitle'),
    finalSubtitle: document.getElementById('finalSubtitle'),
    answeredCount: document.getElementById('answeredCount'),
    selCategoria: document.getElementById('selCategoria'),
    selDificuldade: document.getElementById('selDificuldade'),
    selectorWarn: document.getElementById('selectorWarn'),
    btnStartFiltered: document.getElementById('btnStartFiltered'),
    btnCancelSelector: document.getElementById('btnCancelSelector'),
    btnShare: document.getElementById('btnShare'),
  };

  let userId = null;
  let allQuestions = [];
  let answeredTotal = 0;   // só incrementa em ACERTO
  let askedIds = new Set();
  let voucherIssued = false;

  let batch = [];
  let idxInBatch = 0;

  // estado da pergunta atual
  let currentCorrectKey = '';
  let currentAttempts = 0;
  let locked = false;       // trava após acertar
  let handlingTap = false;  // debounce de toque

  const wait = (ms)=>new Promise(r=>setTimeout(r,ms));
  const fmtDateISO = (d)=>d.toISOString();
  const addDays=(d,days)=>{const t=new Date(d);t.setDate(t.getDate()+days);return t;};
  function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
  function formatVoucherCode(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",p=n=>Array.from({length:n},()=>a[Math.floor(Math.random()*a.length)]).join("");return `HN100–${p(4)}-${p(4)}`;}
  function normalizeKey(v){const s=(v??'').toString().trim().toLowerCase();const m=s.match(/[abcd]/);return m?m[0]:'';}
  function normalizeText(t){return (t??'').toString().trim().toLowerCase().replace(/\s+/g,' ');}

  async function insertSubmission({ user_id, question_id, first_try_correct }){
    const { error } = await client
      .from('submissions')
      .insert({ user_id, question_id, first_try_correct, answered_at: fmtDateISO(new Date()) });
    if(error) console.error('Erro ao gravar submission:', error);
  }

  async function ensureVoucher(user_id){
    let code = formatVoucherCode(), issuedAt = new Date(), expiresAt = addDays(issuedAt,14);
    for(let i=0;i<5;i++){
      const { error } = await client.from('vouchers').insert({
        user_id, code, status:'pendente',
        issued_at:fmtDateISO(issuedAt), expires_at:fmtDateISO(expiresAt),
        partner:'Mina Wine Bar – Praça do Congresso'
      });
      if(!error) return { code, issuedAt, expiresAt };
      if(String(error.message||'').toLowerCase().includes('duplicate')){ code = formatVoucherCode(); continue; }
      console.error('Erro ao criar voucher:', error); break;
    }
    return { code, issuedAt, expiresAt };
  }

  function updateProgress(){
    const total = Math.max(batch.length,1);
    els.progressWrap.style.display='flex';
    els.progressText.textContent = `Pergunta ${Math.min(idxInBatch+1,total)} de ${total}`;
    const pct = ((idxInBatch+1)/total)*100;
    els.progressBar.style.width = `${pct}%`;
  }

  function renderQuestion(){
    const q = batch[idxInBatch];
    updateProgress();

    // reset estado
    currentAttempts = 0;
    locked = false;
    handlingTap = false;

    els.question.textContent = q.enunciado;
    els.feedback.textContent = '';
    els.feedback.className = 'feedback';
    els.btnTryAgain.disabled = true;
    els.btnNext.disabled = true;

    // correta pode vir A/B/C/D ou texto
    currentCorrectKey = normalizeKey(q.correta);
    const optsRaw = [
      {key:'a',label:'A',text:q.alternativa_a},
      {key:'b',label:'B',text:q.alternativa_b},
      {key:'c',label:'C',text:q.alternativa_c},
      {key:'d',label:'D',text:q.alternativa_d},
    ];
    if(!['a','b','c','d'].includes(currentCorrectKey) && q.correta){
      const target=normalizeText(q.correta);
      const hit=optsRaw.find(o=>normalizeText(o.text)===target);
      if(hit) currentCorrectKey=hit.key;
    }
    if(!['a','b','c','d'].includes(currentCorrectKey)){ currentCorrectKey='a'; console.warn('Pergunta sem correta:', q.id); }

    els.options.innerHTML = optsRaw.map(o => `
      <button type="button" class="opt" data-key="${o.key}"
        style="touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent">
        <div class="badge">${o.label}</div><div>${o.text}</div>
      </button>
    `).join('');
  }

  // Delegação de eventos: mais confiável em mobile
  els.options.addEventListener('pointerup', async (ev)=>{
    const btn = ev.target.closest('.opt');
    if(!btn || locked) return;
    if(handlingTap) return;            // debounced
    handlingTap = true;
    setTimeout(()=>handlingTap=false, 120);

    currentAttempts++;
    const key = (btn.dataset.key||'').toLowerCase();

    if(key === currentCorrectKey){
      locked = true;
      els.feedback.textContent='✅ Resposta certa!';
      els.feedback.className='feedback ok';
      els.btnNext.disabled=false;
      els.btnTryAgain.disabled=true;

      const q = batch[idxInBatch];
      askedIds.add(q.id);
      answeredTotal++; // conta ACERTO

      await insertSubmission({
        user_id: userId,
        question_id: q.id,
        first_try_correct: (currentAttempts === 1)
      });

      disableOptions();
    } else {
      els.feedback.textContent='❌ Não é essa. Tente novamente.';
      els.feedback.className='feedback err';
      els.btnTryAgain.disabled=false;
    }
  }, {passive:true});

  function disableOptions(){[...els.options.querySelectorAll('.opt')].forEach(el=>el.classList.add('disabled'));}
  function enableOptions(){[...els.options.querySelectorAll('.opt')].forEach(el=>el.classList.remove('disabled'));}

  function computeUnique(list, key){
    const s = new Set();
    for(const q of list){ const v = (q[key]||'').toString().trim(); if(v) s.add(v); }
    return Array.from(s).sort((a,b)=>a.localeCompare(b,'pt-BR',{sensitivity:'base'}));
  }

  function populateSelector(){
    const cats = computeUnique(allQuestions, 'categoria');
    const difs = computeUnique(allQuestions, 'dificuldade');
    els.selCategoria.innerHTML = cats.map(c=>`<option value="${c}">${c}</option>`).join('');
    els.selDificuldade.innerHTML = difs.map(d=>`<option value="${d}">${d}</option>`).join('');
  }

  function startBatch({ categoria=null, dificuldade=null } = {}){
    const remaining = allQuestions.filter(q => !askedIds.has(q.id));
    let pool = remaining;
    if(categoria)   pool = pool.filter(q => (q.categoria||'').trim() === categoria);
    if(dificuldade) pool = pool.filter(q => (q.dificuldade||'').trim() === dificuldade);

    batch = pool.slice(0, BATCH_SIZE);
    idxInBatch = 0;

    if(batch.length === 0){
      els.selectorWarn.style.display = 'block';
      showView('selector');
      return;
    }
    showView('quiz');
    renderQuestion();
  }

  async function loadAllQuestions(){
    const { data, error } = await client
      .from('questions')
      .select('id,enunciado,alternativa_a,alternativa_b,alternativa_c,alternativa_d,correta,ativa,categoria,dificuldade')
      .eq('ativa', true);
    if(error){ console.error('Erro ao buscar perguntas:', error); return []; }
    return shuffle(data || []);
  }

  // === NOVO: acha uma pergunta substituta para manter o lote com 10 ===
  function findReplacementForBatch() {
    // ids já usados (perguntas já vistas e as que ainda estão no batch)
    const used = new Set([...askedIds, ...batch.map(b=>b.id)]);
    // primeira pergunta ativa que não esteja usada
    return allQuestions.find(q => !used.has(q.id)) || null;
  }

  async function showFinal(){
    showView('final');

    if(!voucherIssued){
      const voucher = await ensureVoucher(userId);
      els.voucherCode.textContent = voucher.code;
      els.voucherValidity.textContent = `Válido até ${new Date(voucher.expiresAt).toLocaleDateString('pt-BR')}`;
      voucherIssued = true;
      els.voucherBox.style.display = 'block';
      els.finalTitle.textContent = 'Parabéns! Você concluiu o Quiz 🎉';
      els.finalSubtitle.textContent = 'Apresente o seu código no parceiro para retirar a revista.';
    }else{
      els.voucherBox.style.display = 'none';
      els.finalTitle.textContent = 'Ótimo! Mais um lote concluído 👏';
      els.finalSubtitle.textContent = 'Quer seguir testando seus conhecimentos?';
    }

    const totalAtivas = allQuestions.length;
    els.answeredCount.textContent = `Você já respondeu ${answeredTotal} de ${totalAtivas} perguntas disponíveis.`;

    const remaining = allQuestions.filter(q => !askedIds.has(q.id)).length;
    els.continueRow.style.display = (remaining > 0) ? 'flex' : 'none';

    els.progressBar.style.width = '100%';

    els.btnDownload.href = (PDF_URL && /^https?:\/\//i.test(PDF_URL)) ? PDF_URL : '#';
    if(!(PDF_URL && /^https?:\/\//i.test(PDF_URL))){
      els.btnDownload.setAttribute('disabled','true');
      els.btnDownload.textContent = 'Baixar o livro (em breve)';
    } else {
      els.btnDownload.removeAttribute('disabled');
      els.btnDownload.textContent = 'Baixar o livro';
    }

    const shareLink = (location.origin || 'https://hnnoticias.com.br') + '/index.html';
    const msg = `Acabei de fazer o Quiz do Centenário de Criciúma do HN Notícias! Responda também e descubra quanto você conhece sobre a nossa história: ${shareLink}`;
    els.btnShare.href = 'https://wa.me/?text=' + encodeURIComponent(msg);
  }

  function showView(name){
    els.quizView.style.display     = (name==='quiz') ? 'block' : 'none';
    els.finalView.style.display    = (name==='final') ? 'block' : 'none';
    els.selectorView.style.display = (name==='selector') ? 'block' : 'none';
  }

  // === Eventos ===
  els.btnTryAgain.addEventListener('click',()=>{
    enableOptions();
    els.feedback.textContent='';
    els.feedback.className='feedback';
    els.btnTryAgain.disabled=true;
  });

  els.btnNext.addEventListener('click',async()=>{
    idxInBatch++;
    if(idxInBatch >= batch.length){ await showFinal(); }
    else { renderQuestion(); }
  });

  // Pular: NÃO conta como respondida e TENTA REPOR no mesmo lote
  els.btnSkip.addEventListener('click',async()=>{
    const skipped = batch[idxInBatch];
    askedIds.add(skipped.id); // não repetir a pulada

    // tenta achar uma substituta
    const replacement = findReplacementForBatch();
    if (replacement) {
      // remove a atual e empurra a substituta para o fim -> mantém tamanho do lote
      batch.splice(idxInBatch, 1);
      batch.push(replacement);
      // não incrementa idxInBatch: a próxima pergunta “desce” para este índice
      renderQuestion();
      return;
    }

    // sem substituta: apenas avança (o lote fica menor)
    idxInBatch++;
    if(idxInBatch >= batch.length){ await showFinal(); }
    else { renderQuestion(); }
  });

  els.btnCopy.addEventListener('click',async()=>{
    const code = els.voucherCode.textContent.trim();
    try{ await navigator.clipboard.writeText(code); els.btnCopy.textContent='Copiado!'; await wait(1000); }
    catch(_){ els.btnCopy.textContent='Selecione e copie'; await wait(1000); }
    els.btnCopy.textContent='Copiar código';
  });

  els.btnContinue.addEventListener('click', ()=>{
    populateSelector();
    els.selectorWarn.style.display = 'none';
    showView('selector');
  });

  els.btnStartFiltered.addEventListener('click', ()=>{
    const categoria = els.selCategoria.value;
    const dificuldade = els.selDificuldade.value;
    els.selectorWarn.style.display = 'none';
    startBatch({ categoria, dificuldade });
  });

  els.btnCancelSelector.addEventListener('click', ()=>{ showView('final'); });

  // === Boot ===
  (async function init(){
    userId = localStorage.getItem('hn_user_id');
    if(!userId){ window.location.href='signup.html'; return; }

    allQuestions = await loadAllQuestions();
    if(!allQuestions.length){
      document.getElementById('question').textContent='Nenhuma pergunta ativa encontrada no momento.';
      document.getElementById('options').innerHTML='';
      els.btnTryAgain.disabled=true; els.btnNext.disabled=true; els.btnSkip.disabled=true;
      return;
    }
    startBatch();
  })();
</script>
