<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz do Centenário de Criciúma — HN Notícias</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#ffffff; --text:#111; --muted:#555;
      --card:#fff; --border:#e9e9e9;
      --gold:#c9a227; --gold-2:#b88900;
      --ok:#17823b; --ok-bg:#e8f6ee; --err:#b00020; --err-bg:#fdecee;
      --opt:#fff; --opt-border:#dedede; --opt-hover:#cfcfcf;
      --btn:#111; --btn-text:#fff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{min-height:100dvh;display:flex;flex-direction:column}
    header{border-bottom:1px solid var(--border);background:#fff}
    .head{width:min(980px,94vw);margin:0 auto;padding:12px 0 8px}
    .logo-wrap{display:flex;justify-content:center}
    .logo-wrap img{display:block;width:100%;max-width:420px;height:auto}
    .head h1{margin:8px 0 0;text-align:center;font-size:clamp(18px,3.6vw,24px)}

    main{width:min(980px,94vw);margin:16px auto;flex:1}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
    .progress{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--muted);font-size:14px}
    .bar{flex:1;height:8px;background:#f1f1f1;border-radius:999px;overflow:hidden;border:1px solid #e6e6e6}
    .bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--gold-2),var(--gold));transition:width .25s}
    .question{font-size:clamp(18px,2.6vw,22px);line-height:1.35;margin:6px 0 12px;font-weight:800}
    .options{display:grid;gap:8px}
    .opt{display:flex;gap:10px;align-items:center;background:var(--opt);border:1px solid var(--opt-border);border-radius:12px;padding:12px;cursor:pointer;transition:border-color .15s,transform .05s}
    .opt:hover{border-color:var(--opt-hover);transform:translateY(-1px)}
    .opt.disabled{opacity:.6;pointer-events:none}
    .badge{flex:0 0 auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;color:var(--gold-2);border:1px solid var(--border)}
    .feedback{min-height:32px;margin:8px 2px 2px;font-weight:700;padding:8px;border-radius:10px;display:none}
    .feedback.ok{display:block;color:var(--ok);background:var(--ok-bg);border:1px solid #cdebd8}
    .feedback.err{display:block;color:var(--err);background:var(--err-bg);border:1px solid #f6c9cf}
    .actions{display:flex;gap:8px;justify-content:space-between;margin-top:10px}
    .btn{appearance:none;border:1px solid var(--btn);background:var(--btn);color:var(--btn-text);border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
    .btn.secondary{background:#fff;color:#111;border:1px solid #cfcfcf}
    .btn[disabled]{opacity:.5;cursor:not-allowed}

    .final{text-align:center;padding:6px}
    .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
    .voucher{margin:10px auto;padding:14px;border-radius:16px;border:1px dashed var(--gold-2);background:#fff;max-width:560px}
    .voucher h3{margin:0 0 6px;font-size:20px;color:var(--gold-2)}
    .code{font-size:clamp(20px,4vw,26px);letter-spacing:2px;font-weight:900;background:#fafafa;border:1px solid #e6e6e6;padding:8px 12px;border-radius:12px;display:inline-block;margin:6px 0 0}
    .note{color:var(--muted);font-size:14px;margin-top:6px}

    footer{border-top:1px solid var(--border);background:#fff}
    .footer-inner{width:min(980px,94vw);margin:0 auto;padding:12px;display:flex;justify-content:center}
    .footer-inner img{max-width:100%;height:auto}

    @media (max-height:760px){
      .head{padding:8px 0 4px}
      .logo-wrap img{max-width:360px}
      .head h1{font-size:18px;margin-top:6px}
      main{margin:10px auto}
      .card{padding:12px}
      .question{margin:4px 0 10px}
      .opt{padding:10px}
      .btn{padding:9px 12px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head">
      <div class="logo-wrap"><img src="assets/hn-logo.png" alt="HN Notícias"></div>
      <h1>Quiz do Centenário de Criciúma</h1>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="progress" id="progressWrap" style="display:none">
        <span id="progressText">Pergunta 1</span>
        <div class="bar"><div id="progressBar"></div></div>
      </div>

      <div id="quizView">
        <div id="question" class="question"></div>
        <div id="options" class="options"></div>
        <div id="feedback" class="feedback"></div>
        <div class="actions">
          <button class="btn secondary" id="btnSkip">Pular</button>
          <div style="display:flex; gap:8px;">
            <button class="btn secondary" id="btnTryAgain" disabled>Tentar novamente</button>
            <button class="btn" id="btnNext" disabled>Próxima</button>
          </div>
        </div>
      </div>

      <div id="finalView" class="final" style="display:none">
        <h2 id="finalTitle" style="margin:6px 0 6px;font-size:clamp(20px,4vw,26px)">Parabéns! Você concluiu o Quiz 🎉</h2>
        <p id="finalSubtitle">Apresente o seu código no parceiro para retirar a revista.</p>

        <div id="voucherBox" class="voucher">
          <h3>Seu código de retirada</h3>
          <div id="voucherCode" class="code">HN100–XXXX-XXXX</div>
          <div class="note" id="voucherValidity">Válido até —</div>
          <div class="note">Parceiro: Mina Wine Bar – Praça do Congresso</div>
        </div>

        <div class="btn-row">
          <a id="btnDownload" class="btn" href="#" target="_blank" rel="noopener">Baixar o livro</a>
          <button id="btnCopy" class="btn secondary">Copiar código</button>
          <a class="btn secondary" href="https://hnnoticias.com.br" target="_blank" rel="noopener">Ir para o site HN Notícias</a>
        </div>

        <div class="btn-row" id="continueRow" style="margin-top:12px;display:none">
          <button class="btn" id="btnContinue">Continuar respondendo</button>
          <a class="btn secondary" href="index.html">Encerrar</a>
        </div>

        <p class="note" id="answeredCount" style="margin-top:10px;"></p>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <img src="assets/banner-projeto-centenario.png.jpg" alt="Projeto Criciúma 100 Anos — banner oficial" />
    </div>
  </footer>
</div>

<script>
  // === CONFIG ===
  const SUPABASE_URL = "https://fpstwfzqvactvlgwgagu.supabase.co";
  const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZwc3R3ZnpxdmFjdHZsZ3dnYWd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA2NjE2NTgsImV4cCI6MjA3NjIzNzY1OH0._hoxv_VMLcK6ZAVjmR2mV1t8Ma5vr9h-Ti_sIL42CPI";
  const PDF_URL = "";      // link do livro se já tiver
  const BATCH_SIZE = 10;   // 10 por “lote”

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  // === Estado ===
  const els = {
    progressWrap: document.getElementById('progressWrap'),
    progressText: document.getElementById('progressText'),
    progressBar: document.getElementById('progressBar'),
    question: document.getElementById('question'),
    options: document.getElementById('options'),
    feedback: document.getElementById('feedback'),
    btnTryAgain: document.getElementById('btnTryAgain'),
    btnNext: document.getElementById('btnNext'),
    btnSkip: document.getElementById('btnSkip'),
    quizView: document.getElementById('quizView'),
    finalView: document.getElementById('finalView'),
    voucherBox: document.getElementById('voucherBox'),
    voucherCode: document.getElementById('voucherCode'),
    voucherValidity: document.getElementById('voucherValidity'),
    btnDownload: document.getElementById('btnDownload'),
    btnCopy: document.getElementById('btnCopy'),
    btnContinue: document.getElementById('btnContinue'),
    continueRow: document.getElementById('continueRow'),
    finalTitle: document.getElementById('finalTitle'),
    finalSubtitle: document.getElementById('finalSubtitle'),
    answeredCount: document.getElementById('answeredCount'),
  };

  let userId = null;
  let allQuestions = [];       // todas as ativas
  let answeredTotal = 0;       // acumulado de respondidas (acertos)
  let askedIds = new Set();    // ids já apresentados (para não repetir)
  let voucherIssued = false;   // só na primeira vez

  // estado do lote atual
  let batch = [];              // perguntas deste lote
  let idxInBatch = 0;          // índice dentro do lote

  // === Utils ===
  const wait = (ms)=>new Promise(r=>setTimeout(r,ms));
  const fmtDateISO = (d)=>d.toISOString();
  const addDays=(d,days)=>{const t=new Date(d);t.setDate(t.getDate()+days);return t;};
  function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
  function formatVoucherCode(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",p=n=>Array.from({length:n},()=>a[Math.floor(Math.random()*a.length)]).join("");return `HN100–${p(4)}-${p(4)}`;}
  function normalizeKey(v){const s=(v??'').toString().trim().toLowerCase();const m=s.match(/[abcd]/);return m?m[0]:'';}
  function normalizeText(t){return (t??'').toString().trim().toLowerCase().replace(/\s+/g,' ');}

  async function insertSubmission({ user_id, question_id, first_try_correct }){
    const { error } = await client.from('submissions').insert({ user_id, question_id, first_try_correct, answered_at: fmtDateISO(new Date()) });
    if(error) console.error('Erro ao gravar submission:', error);
  }

  async function ensureVoucher(user_id){
    let code = formatVoucherCode(), issuedAt = new Date(), expiresAt = addDays(issuedAt,14);
    for(let i=0;i<5;i++){
      const { error } = await client.from('vouchers').insert({
        user_id, code, status:'pendente', issued_at:fmtDateISO(issuedAt), expires_at:fmtDateISO(expiresAt),
        partner:'Mina Wine Bar – Praça do Congresso'
      });
      if(!error) return { code, issuedAt, expiresAt };
      if(String(error.message||'').toLowerCase().includes('duplicate')){ code = formatVoucherCode(); continue; }
      console.error('Erro ao criar voucher:', error); break;
    }
    return { code, issuedAt, expiresAt };
  }

  function updateProgress(){
    const total = Math.max(batch.length,1);
    els.progressWrap.style.display='flex';
    els.progressText.textContent = `Pergunta ${Math.min(idxInBatch+1,total)} de ${total}`;
    const pct = ((idxInBatch+1)/total)*100;
    els.progressBar.style.width = `${pct}%`;
  }

  function renderQuestion(){
    const q = batch[idxInBatch];
    updateProgress();

    els.question.textContent = q.enunciado;
    els.feedback.textContent = '';
    els.feedback.className = 'feedback';
    els.btnTryAgain.disabled = true;
    els.btnNext.disabled = true;

    // correta pode vir como a/b/c/d OU como o texto da alternativa
    let correctKey = normalizeKey(q.correta);
    const optsRaw = [
      {key:'a',label:'A',text:q.alternativa_a},
      {key:'b',label:'B',text:q.alternativa_b},
      {key:'c',label:'C',text:q.alternativa_c},
      {key:'d',label:'D',text:q.alternativa_d},
    ];
    if(!['a','b','c','d'].includes(correctKey) && q.correta){
      const target=normalizeText(q.correta);
      const hit=optsRaw.find(o=>normalizeText(o.text)===target);
      if(hit) correctKey=hit.key;
    }
    const opts = optsRaw.map(o=>({...o,isCorrect:o.key===correctKey}));
    if(!opts.some(o=>o.isCorrect)){opts[0].isCorrect=true;console.warn('Pergunta sem correta definida:',q.id);}

    els.options.innerHTML='';
    for(const opt of opts){
      const btn=document.createElement('button');
      btn.type='button'; btn.className='opt';
      btn.innerHTML=`<div class="badge">${opt.label}</div><div>${opt.text}</div>`;
      let attempts = 0;
      btn.addEventListener('click', async ()=>{
        attempts++;
        if(opt.isCorrect){
          els.feedback.textContent='✅ Resposta certa!';
          els.feedback.className='feedback ok';
          els.btnNext.disabled=false;
          els.btnTryAgain.disabled=true;
          askedIds.add(q.id);
          answeredTotal++;
          await insertSubmission({ user_id:userId, question_id:q.id, first_try_correct: attempts===1 });
          disableOptions();
        }else{
          els.feedback.textContent='❌ Não é essa. Tente novamente.';
          els.feedback.className='feedback err';
          els.btnTryAgain.disabled=false;
        }
      });
      els.options.appendChild(btn);
    }
  }

  function disableOptions(){[...els.options.querySelectorAll('.opt')].forEach(el=>el.classList.add('disabled'));}
  function enableOptions(){[...els.options.querySelectorAll('.opt')].forEach(el=>el.classList.remove('disabled'));}

  function startBatch(){
    // pega as próximas não usadas
    const remaining = allQuestions.filter(q => !askedIds.has(q.id));
    batch = remaining.slice(0, BATCH_SIZE);
    idxInBatch = 0;

    // se não há mais perguntas, só mostra final “acabou”
    if(batch.length === 0){
      showFinal({ noMore:true });
      return;
    }

    els.quizView.style.display = 'block';
    els.finalView.style.display = 'none';
    renderQuestion();
  }

  async function loadAllQuestions(){
    const { data, error } = await client
      .from('questions')
      .select('id,enunciado,alternativa_a,alternativa_b,alternativa_c,alternativa_d,correta,ativa')
      .eq('ativa', true);
    if(error){ console.error('Erro ao buscar perguntas:', error); return []; }
    return shuffle(data || []);
  }

  async function showFinal({ noMore=false } = {}){
    els.quizView.style.display = 'none';
    els.finalView.style.display = 'block';

    // voucher apenas no primeiro lote concluído
    if(!voucherIssued){
      const voucher = await ensureVoucher(userId);
      els.voucherCode.textContent = voucher.code;
      els.voucherValidity.textContent = `Válido até ${new Date(voucher.expiresAt).toLocaleDateString('pt-BR')}`;
      voucherIssued = true;
      els.voucherBox.style.display = 'block';
      els.finalTitle.textContent = 'Parabéns! Você concluiu o Quiz 🎉';
      els.finalSubtitle.textContent = 'Apresente o seu código no parceiro para retirar a revista.';
    }else{
      // nos lotes seguintes, não gerar novo voucher
      els.voucherBox.style.display = 'none';
      els.finalTitle.textContent = 'Ótimo! Mais um lote concluído 👏';
      els.finalSubtitle.textContent = 'Quer seguir testando seus conhecimentos?';
    }

    const totalAtivas = allQuestions.length;
    els.answeredCount.textContent = `Você já respondeu ${answeredTotal} de ${totalAtivas} perguntas disponíveis.`;

    // exibe “Continuar” apenas se há mais perguntas
    const remaining = allQuestions.filter(q => !askedIds.has(q.id)).length;
    els.continueRow.style.display = (!noMore && remaining > 0) ? 'flex' : 'none';

    // barra completa no final
    els.progressBar.style.width = '100%';

    // botões
    els.btnDownload.href = (PDF_URL && /^https?:\/\//i.test(PDF_URL)) ? PDF_URL : '#';
    if(!(PDF_URL && /^https?:\/\//i.test(PDF_URL))){
      els.btnDownload.setAttribute('disabled','true');
      els.btnDownload.textContent = 'Baixar o livro (em breve)';
    } else {
      els.btnDownload.removeAttribute('disabled');
      els.btnDownload.textContent = 'Baixar o livro';
    }
  }

  // === Eventos ===
  els.btnTryAgain.addEventListener('click',()=>{enableOptions();els.feedback.textContent='';els.feedback.className='feedback';els.btnTryAgain.disabled=true;});
  els.btnNext.addEventListener('click',async()=>{
    idxInBatch++;
    if(idxInBatch >= batch.length){ await showFinal(); }
    else { renderQuestion(); }
  });
  els.btnSkip.addEventListener('click',async()=>{
    // pular: não grava submission e segue
    const q = batch[idxInBatch];
    askedIds.add(q.id); // ainda assim marque como “vista” para não repetir
    idxInBatch++;
    if(idxInBatch >= batch.length){ await showFinal(); }
    else { renderQuestion(); }
  });
  els.btnCopy.addEventListener('click',async()=>{
    const code = els.voucherCode.textContent.trim();
    try{ await navigator.clipboard.writeText(code); els.btnCopy.textContent='Copiado!'; await wait(1000); }
    catch(_){ els.btnCopy.textContent='Selecione e copie'; await wait(1000); }
    els.btnCopy.textContent='Copiar código';
  });
  els.btnContinue.addEventListener('click', ()=> startBatch());

  // === Boot ===
  (async function init(){
    userId = localStorage.getItem('hn_user_id');
    if(!userId){ window.location.href='signup.html'; return; }

    allQuestions = await loadAllQuestions();
    if(!allQuestions.length){
      els.question.textContent = 'Nenhuma pergunta ativa encontrada no momento. Tente novamente mais tarde.';
      els.options.innerHTML = '';
      els.btnTryAgain.disabled = true; els.btnNext.disabled = true; els.btnSkip.disabled = true;
      return;
    }

    startBatch();
  })();
</script>
</body>
</html>
