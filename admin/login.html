<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – Login | Quiz Centenário</title>
  <style>
    :root{ --bg:#fff; --text:#111; --muted:#666; --border:#e9e9e9; --gold:#c9a227; }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{min-height:100dvh;display:grid;place-items:center;padding:20px}
    .card{width:min(420px,94vw);background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px}
    h1{font-size:22px;margin:0 0 8px}
    p{margin:0 0 14px;color:var(--muted)}
    label span{display:block;font-size:14px;font-weight:700;margin:10px 0 6px}
    input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:16px}
    .btn{margin-top:14px;width:100%;padding:12px 14px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:800;cursor:pointer}
    .msg{margin-top:10px;padding:10px;border-radius:10px;background:#fdecee;color:#b00020;border:1px solid #f6c9cf;display:none}
    .foot{margin-top:10px;font-size:12px;color:var(--muted);text-align:center}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Área Administrativa</h1>
    <p>Faça login para acessar o painel.</p>

    <label><span>Usuário</span>
      <input id="user" autocomplete="username" placeholder="HNNoticias" />
    </label>
    <label><span>Senha</span>
      <input id="pass" type="password" autocomplete="current-password" placeholder="centenario" />
    </label>
    <button id="btnLogin" class="btn">Entrar</button>
    <div id="msg" class="msg"></div>
    <div class="foot">Projeto HN Notícias • Quiz Centenário</div>
  </div>
</div>

<script>
  // ✅ Endpoint público da sua Edge Function (mantemos o que você usou)
  const ADMIN_LOGIN_URL = "https://fpstwfzqvactvlgwgagu.supabase.co/functions/v1/admin-login";

  // ✅ ANON KEY do projeto – necessária para chamar Edge Functions públicas a partir do front
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZwc3R3ZnpxdmFjdHZsZ3dnYWd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA2NjE2NTgsImV4cCI6MjA3NjIzNzY1OH0._hoxv_VMLcK6ZAVjmR2mV1t8Ma5vr9h-Ti_sIL42CPI";

  async function adminLogin(user, pass){
    // evita espaços acidentais
    user = (user || "").trim();
    pass = (pass || "").trim();

    const res = await fetch(ADMIN_LOGIN_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "apikey": SUPABASE_ANON_KEY
      },
      // acrescenta um noCache para evitar CDN/Cache velho
      cache: "no-store",
      body: JSON.stringify({ user, pass })
    });

    let data = {};
    try { data = await res.json(); } catch(_) {}

    // 🔎 logs de diagnóstico no console
    console.log("[admin-login] status:", res.status, "response:", data);

    if (!res.ok || !data.ok) {
      // diferencia 401 (credenciais) de outros erros
      const msg = (res.status === 401 || data.error === "invalid")
        ? "invalid"
        : (data.error || "fail");
      throw new Error(msg);
    }
    return data; // { ok:true, token, name }
  }

  function showMsg(text){
    const msg = document.getElementById('msg');
    msg.textContent = text;
    msg.style.display = 'block';
  }

  document.getElementById('btnLogin').addEventListener('click', submitLogin);
  document.getElementById('pass').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') submitLogin();
  });

  async function submitLogin(){
    const user = document.getElementById('user').value;
    const pass = document.getElementById('pass').value;
    const msg = document.getElementById('msg');
    msg.style.display = 'none';
    msg.textContent = '';

    if(!user || !pass){
      showMsg("Preencha usuário e senha.");
      return;
    }

    try{
      const { token, name } = await adminLogin(user, pass);
      localStorage.setItem('hn_admin_token', token);
      localStorage.setItem('hn_admin_name', name || user);
      // força navegação limpa (sem cache)
      window.location.replace("index.html");
    }catch(err){
      showMsg(err.message === "invalid"
        ? "Usuário ou senha inválidos."
        : "Falha no login. Tente novamente.");
    }
  }

  // força recarregar sem cache quando a página for carregada (ajuda no Netlify)
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) {
      window.location.reload();
    }
  });
</script>
</body>
</html>
